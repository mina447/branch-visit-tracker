<!DOCTYPE html><html class="dark" lang="en"><head>

<style>
        body {
            background-color: #0b1326;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            animation: move 20s infinite alternate;
        }

        .blob-purple {
            background: #571bc1;
            top: -100px;
            right: -100px;
        }

        .blob-blue {
            background: #06b6d4;
            bottom: -100px;
            left: -100px;
            animation-delay: -5s;
        }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(50px, 100px) scale(1.1); }
        }

        .glass-card {
            background: rgba(23, 31, 51, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .input-glow:focus {
            outline: none;
            border-color: #4cd7f6;
            box-shadow: 0 0 12px rgba(76, 215, 246, 0.4);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #571bc1 0%, #06b6d4 100%);
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            box-shadow: 0 0 20px rgba(87, 27, 193, 0.4);
            transform: translateY(-1px);
        }

        .btn-gradient:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="antialiased">
<!-- Background Atmospheric Blobs -->
<div class="blob blob-purple"></div>
<div class="blob blob-blue"></div>
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<!-- Glassmorphic Container -->
<div class="glass-card rounded-[24px] p-container-padding flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-base flex items-center justify-center p-4 bg-white/5 rounded-full ring-1 ring-white/10">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">
                    monitoring
                </span>
</div>
<header class="text-center mb-10">
<h1 class="font-display-lg text-primary text-[28px] md:text-headline-md tracking-tighter mb-2">
                    Branch Tracker
                </h1>
<p class="font-headline-sm text-on-surface-variant text-[18px] md:text-body-lg">
                    مرحباً بك مجدداً في نظام المتابعة
                </p>
</header>
<!-- Login Form -->
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1">
                        IDENTIFIER / المعرف
                    </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] transition-colors group-focus-within:text-primary">
                            account_circle
                        </span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest/40 border border-white/10 rounded-xl font-body-md text-on-surface placeholder:text-outline-variant input-glow transition-all" placeholder="Enter your operational ID" type="text">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-caps text-label-caps text-on-surface-variant">
                            SECURE KEY / كلمة المرور
                        </label>
<a class="font-label-caps text-[10px] text-primary hover:underline transition-all" href="#">
                            FORGOT?
                        </a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] transition-colors group-focus-within:text-primary">
                            lock
                        </span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest/40 border border-white/10 rounded-xl font-body-md text-on-surface placeholder:text-outline-variant input-glow transition-all" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Security Status -->
<div class="flex items-center justify-between py-2">
<label class="flex items-center space-x-2 cursor-pointer group">
<div class="relative">
<input class="peer sr-only" type="checkbox">
<div class="w-5 h-5 border border-white/20 rounded bg-white/5 peer-checked:bg-primary peer-checked:border-primary transition-all"></div>
<span class="material-symbols-outlined absolute inset-0 text-on-primary text-[16px] hidden peer-checked:block">check</span>
</div>
<span class="font-body-md text-[14px] text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Session</span>
</label>
<div class="flex items-center space-x-1.5">
<div class="w-2 h-2 rounded-full bg-tertiary animate-pulse shadow-[0_0_8px_rgba(78,222,163,0.6)]"></div>
<span class="font-label-caps text-[10px] text-tertiary tracking-widest uppercase">System Secure</span>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-14 rounded-xl btn-gradient text-white font-headline-sm text-body-lg flex items-center justify-center space-x-2 shadow-lg" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<footer class="mt-8 flex flex-col items-center space-y-4">
<p class="font-body-md text-[14px] text-on-surface-variant">
                    Don't have access? <a class="text-primary font-semibold hover:underline" href="#">Contact Admin</a>
</p>
<div class="flex items-center space-x-4 opacity-40">
<div class="h-[1px] w-8 bg-white/20"></div>
<span class="font-label-caps text-[10px] tracking-widest">ENCRYPTION V2.4.0</span>
<div class="h-[1px] w-8 bg-white/20"></div>
</div>
</footer>
</div>
<!-- Secondary Decoration -->
<div class="mt-8 flex justify-center space-x-6">
<div class="flex items-center space-x-2 text-on-surface-variant/40 hover:text-primary transition-colors cursor-help">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="font-label-caps text-[10px]">SSO READY</span>
</div>
<div class="flex items-center space-x-2 text-on-surface-variant/40 hover:text-primary transition-colors cursor-help">
<span class="material-symbols-outlined text-[18px]">language</span>
<span class="font-label-caps text-[10px]">GLOBAL SYNC</span>
</div>
</div>
</main>
<script>
        // Micro-interaction for inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.transform = 'translateY(-50%) scale(1.1)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.transform = 'translateY(-50%) scale(1)';
            });
        });

        // Subtle parallax effect on blobs
        document.addEventListener('mousemove', (e) => {
            const blobs = document.querySelectorAll('.blob');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            blobs.forEach((blob, index) => {
                const speed = (index + 1) * 20;
                blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
</body></html>
